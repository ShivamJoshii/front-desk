<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2d72d2">
<link rel="manifest" href="/manifest.webmanifest">
<title>Front Desk</title>
<style>/*BLUEPRINT_CSS*/</style>
<style>/*BASE_CSS*/</style>
<style>/*FOCUS_CSS*/
/* app-only additions */
.login{max-width:420px;margin:12vh auto 0;padding:28px}
.login h1{font-size:26px;margin:0 0 6px}
.login p{color:var(--app-muted);margin:0 0 18px}
.hidden{display:none !important}
.waitcard .big{font-size:20px;font-weight:600;margin:0 0 6px}
.facts{display:flex;gap:6px;flex-wrap:wrap;margin:-6px 0 16px}
.booking{margin-top:14px;padding:14px;border-radius:6px;background:var(--app-soft)}
.booking .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.booking input,.booking select{font-size:16px}
.lostwhy{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.owners{max-width:1100px;margin:0 auto;padding:16px}
.owners .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.owners .stat{padding:12px 14px}
.owners .stat .lab{font-size:12px;color:var(--app-muted)}
.owners .stat .num{font-size:28px;font-weight:600;line-height:1.1;margin-top:4px}
.owners .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.owners table{width:100%}
.settings{max-width:640px;margin:0 auto;padding:16px}
.leadlist{max-width:760px;margin:0 auto;padding:16px}
.leadlist .row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 14px;margin-bottom:6px;cursor:pointer}
.leadlist .nm{font-weight:600}.leadlist .sub{font-size:12px;color:var(--app-muted)}
.calllink{display:block;text-align:center;font-size:13px;color:var(--app-muted);margin-top:8px}
@media (max-width:900px){.owners .grid{grid-template-columns:repeat(2,1fr)}.owners .two{grid-template-columns:1fr}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<!--ICONS-->
</defs></svg>

<nav class="bp6-navbar">
  <div class="bp6-navbar-group bp6-align-left">
    <div class="bp6-navbar-heading brand"><span class="dot"></span><span>Front Desk</span><span class="store nav-store" id="storeName"></span></div>
  </div>
  <div class="bp6-navbar-group bp6-align-right" id="navRight" style="display:none">
    <button class="bp6-button bp6-minimal nav-center" data-nav="today"><svg class="ic"><use href="#i-flag"/></svg>&nbsp;Today</button>
    <button class="bp6-button bp6-minimal nav-center" data-nav="leads"><svg class="ic"><use href="#i-search"/></svg>&nbsp;Leads</button>
    <button class="bp6-button bp6-minimal nav-center" data-nav="owners"><svg class="ic"><use href="#i-dashboard"/></svg>&nbsp;Owners</button>
    <button class="bp6-button bp6-intent-success nav-center" data-walkin><svg class="ic"><use href="#i-walk"/></svg>&nbsp;Walk-in</button>
    <span class="bp6-navbar-divider"></span>
    <button class="bp6-button bp6-minimal" id="darkBtn" title="Dark mode"><svg class="ic"><use href="#i-moon"/></svg></button>
    <button class="bp6-button bp6-minimal" data-nav="settings" title="Settings"><svg class="ic"><use href="#i-cog"/></svg></button>
    <button class="bp6-button bp6-minimal" id="userBtn"><svg class="ic"><use href="#i-user"/></svg>&nbsp;<span class="nav-store" id="userName"></span></button>
  </div>
</nav>

<!-- LOGIN -->
<main class="view" id="view-login">
  <div class="bp6-card bp6-elevation-1 login">
    <h1>Front Desk</h1>
    <p>Sign in with your work email. We send a link, no password.</p>
    <div class="bp6-input-group bp6-large"><input class="bp6-input" id="loginEmail" type="email" inputmode="email" placeholder="you@floorandmorecanada.com" autocomplete="email"></div>
    <button class="bp6-button bp6-intent-primary bp6-large go" id="loginBtn" style="width:100%;margin-top:12px">Send me the link</button>
    <div id="loginMsg" class="bp6-text-muted" style="margin-top:12px"></div>
  </div>
</main>

<!-- TODAY -->
<main class="view focus-view hidden" id="view-today">
  <div class="dayline"><span id="clock"></span><span class="bp6-text-muted" id="progressText"></span></div>
  <div class="bp6-progress-bar bp6-intent-primary bp6-no-stripes bp6-no-animation dayprog"><div class="bp6-progress-meter" id="progressBar" style="width:0%"></div></div>
  <section class="stage" id="stage"><div class="bp6-card card"><p class="say bp6-text-muted">Loading…</p></div></section>
  <div class="upnext" id="upnext"></div>
</main>

<!-- LEADS -->
<main class="view hidden" id="view-leads">
  <div class="leadlist">
    <div class="bp6-input-group bp6-large" style="margin-bottom:12px"><input class="bp6-input" id="leadSearch" placeholder="Search a name or phone"></div>
    <div id="leadRows"></div>
  </div>
</main>

<!-- OWNERS -->
<main class="view hidden" id="view-owners"><div class="owners" id="ownersBody"><p class="bp6-text-muted">Loading…</p></div></main>

<!-- SETTINGS -->
<main class="view hidden" id="view-settings"><div class="settings" id="settingsBody"></div></main>

<!-- LEAD PANEL -->
<div class="panel-back" id="panelBack"></div>
<aside class="panel" id="panel" aria-hidden="true">
  <div class="hd"><div><h3 id="pName">—</h3><div class="sub" id="pSub"></div></div><button class="bp6-button bp6-minimal" id="panelClose"><svg class="ic"><use href="#i-cross"/></svg></button></div>
  <div class="bd">
    <div class="nextstep" id="pNextWrap"><div><div class="bp6-text-muted bp6-text-small">Next step</div><b id="pNext">—</b></div></div>
    <div class="qgrid" id="pQ"></div>
    <div class="notebox" id="noteBox">
      <textarea class="bp6-input bp6-fill" id="nText" rows="2" placeholder="Leave a note — goes on the lead here and into GHL"></textarea>
      <div class="promise">
        <span class="bp6-text-muted bp6-text-small">I promised to…</span>
        <div class="chips" id="nPromise">
          <button class="bp6-button bp6-small bp6-outlined" data-p="">nothing</button>
          <button class="bp6-button bp6-small bp6-outlined" data-p="Send the PDF / render">send the PDF</button>
          <button class="bp6-button bp6-small bp6-outlined" data-p="Call back">call back</button>
          <button class="bp6-button bp6-small bp6-outlined" data-p="Send the quote">send the quote</button>
          <button class="bp6-button bp6-small bp6-outlined" data-p="Book the visit">book the visit</button>
          <button class="bp6-button bp6-small bp6-outlined" data-p="Send the address + times">send address</button>
        </div>
        <div class="when" id="nWhen" hidden>
          <span class="bp6-text-muted bp6-text-small">by</span>
          <div class="bp6-html-select bp6-small"><select id="nDue"><option value="60">in 1 hour</option><option value="eod">end of today</option><option value="tom9">tomorrow 9:00</option><option value="tom15">tomorrow 15:00</option><option value="pick">pick a time…</option></select></div>
          <input class="bp6-input bp6-small" type="datetime-local" id="nDueAt" hidden>
        </div>
      </div>
      <div class="row2"><span class="bp6-text-small bp6-text-muted" id="nHint"></span><button class="bp6-button bp6-intent-primary" id="nSave">Save note</button></div>
    </div>
    <h5 class="bp6-heading" style="margin:0 0 10px">What happened</h5>
    <div class="thread" id="pThread"></div>
  </div>
</aside>

<!-- WALK-IN -->
<div class="ovl" id="walkin">
  <div class="bp6-dialog">
    <div class="bp6-dialog-header"><h6 class="bp6-heading">Walk-in · 20 seconds</h6><button class="bp6-dialog-close-button bp6-button bp6-minimal" data-walkin-close><svg class="ic"><use href="#i-cross"/></svg></button></div>
    <div class="bp6-dialog-body">
      <div class="bp6-form-group"><label class="bp6-label">Name</label><div class="bp6-input-group bp6-large"><input class="bp6-input" id="wName" placeholder="First and last" autocomplete="off"></div></div>
      <div class="bp6-form-group"><label class="bp6-label">Phone</label><div class="bp6-input-group bp6-large"><input class="bp6-input" id="wPhone" inputmode="tel" placeholder="780-"></div></div>
      <div class="bp6-form-group"><label class="bp6-label">Here for</label><div class="bp6-html-select bp6-large bp6-fill"><select id="wService"><option>Vinyl plank</option><option>Laminate</option><option>Hardwood</option><option>Tile</option><option>Carpet</option><option>Full reno</option></select></div></div>
      <label class="bp6-control bp6-checkbox bp6-large"><input type="checkbox" class="bp6-control-input" id="wConsent" checked><span class="bp6-control-indicator"></span>OK to text / email about this project</label>
    </div>
    <div class="bp6-dialog-footer"><div class="bp6-dialog-footer-actions"><button class="bp6-button" data-walkin-close>Cancel</button><button class="bp6-button bp6-intent-success bp6-large" id="walkinSave">Save · follow-up tomorrow 10:00</button></div></div>
  </div>
</div>

<div class="bottombar" id="bottombar" style="display:none">
  <button class="bp6-button bp6-intent-success bp6-large" data-walkin><svg class="ic"><use href="#i-walk"/></svg>&nbsp;Walk-in</button>
  <button class="bp6-button bp6-outlined bp6-large" data-nav="leads">Leads</button>
  <button class="bp6-button bp6-outlined bp6-large" data-nav="owners">Owners</button>
</div>

<div class="bp6-toast bp6-intent-success toast" id="toast"><span class="bp6-toast-message" id="toastMsg">Saved</span></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>/*APP_JS*/</script>
</body>
</html>
