<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2d72d2">
<link rel="manifest" href="/manifest.webmanifest">
<title>Front Desk</title>
<style>/*BLUEPRINT_CSS*/</style>
<style>/*BASE_CSS*/</style>
<style>/*FOCUS_CSS*/
/* app-only additions */
.login{max-width:420px;margin:12vh auto 0;padding:28px}
.login h1{font-size:26px;margin:0 0 6px}
.login p{color:var(--app-muted);margin:0 0 18px}
.login .bp6-form-group{margin-bottom:14px}
.login input{font-size:16px}
.login-msg{margin-top:12px;min-height:20px;color:var(--app-muted)}
.login-msg.err{color:var(--app-danger)}
#forgotBtn{margin:4px 0 0 -10px;color:var(--app-muted)}
.team-list{display:flex;flex-direction:column;margin:8px 0 14px}
.team-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--app-line)}
.team-row:first-child{border-top:0}
.team-row .nm{font-weight:600;min-width:110px}
.team-row .em{color:var(--app-muted);font-size:13px;flex:1;min-width:180px;overflow-wrap:anywhere}
.team-row .acts{display:flex;gap:4px;margin-left:auto}
.team-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;border-radius:6px;background:var(--app-soft)}
.team-form .full{grid-column:1/-1}
.team-form input,.team-form select,.pw-row input{font-size:16px}
.pw-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.pw-row input{flex:1 1 200px}
@media (max-width:640px){.team-form{grid-template-columns:1fr}}
.hidden{display:none !important}
.waitcard .big{font-size:20px;font-weight:600;margin:0 0 6px}
.facts{display:flex;gap:6px;flex-wrap:wrap;margin:-6px 0 16px}
.booking{margin-top:14px;padding:14px;border-radius:6px;background:var(--app-soft)}
.booking .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.booking input,.booking select{font-size:16px}
.lostwhy{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.owners{max-width:1100px;margin:0 auto;padding:16px}
.owners .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.owners .stat{padding:12px 14px}
.owners .stat .lab{font-size:12px;color:var(--app-muted)}
.owners .stat .num{font-size:28px;font-weight:600;line-height:1.1;margin-top:4px}
.owners .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.owners table{width:100%}
.settings{max-width:640px;margin:0 auto;padding:16px}
.leadlist{max-width:760px;margin:0 auto;padding:16px}
.leadlist .row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 14px;margin-bottom:6px;cursor:pointer}
.leadlist .nm{font-weight:600}.leadlist .sub{font-size:12px;color:var(--app-muted)}
.calllink{display:block;text-align:center;font-size:13px;color:var(--app-muted);margin-top:8px}
@media (max-width:900px){.owners .grid{grid-template-columns:repeat(2,1fr)}.owners .two{grid-template-columns:1fr}}
/* team board */
:root{--area-sales:#215db0;--area-ops:#935610;--area-marketing:#634dbf}
.bp6-dark{--area-sales:#8abbff;--area-ops:#fbb360;--area-marketing:#bdadff}
.board{max-width:1240px;margin:0 auto;padding:16px 20px 110px}
.board-hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
.board-hd h2{margin:0;font-size:26px;letter-spacing:-.3px}
.board-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.board-stats .stat{display:flex;flex-direction:column;justify-content:space-between}.board-stats .num.late{color:var(--app-danger)}.board-stats .num.ok{color:var(--app-success)}
.board-filters{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .bp6-button{border-radius:999px;min-height:36px;padding:0 14px}
.chips.seg .bp6-button{flex:1;border-radius:6px;min-height:40px;font-weight:600}
.board-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
.board-cols.one{grid-template-columns:minmax(0,760px)}
.bcol h3{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px;font-size:17px;font-weight:700}
.bcol h3 .n,.bdone summary .n{font-size:13px;color:var(--app-muted);font-weight:500}
.area-sales{color:var(--area-sales)}.area-ops{color:var(--area-ops)}.area-marketing{color:var(--area-marketing)}
.atag{font-weight:600}.atag.sales{color:var(--area-sales)}.atag.ops{color:var(--area-ops)}.atag.marketing{color:var(--area-marketing)}
.tcard{display:flex;gap:6px;align-items:flex-start;padding:10px 12px 12px 6px;margin-bottom:8px;cursor:pointer}
.tcheck{flex:none;width:40px;height:40px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;color:#fff}
.tcheck i{width:22px;height:22px;border-radius:50%;border:2px solid var(--app-muted);display:flex;align-items:center;justify-content:center}
.tcheck:hover i,.tcheck:focus-visible i{border-color:var(--app-success)}
.tcard.done .tcheck i{background:var(--app-success);border-color:var(--app-success)}
.tcheck .ic{width:12px;height:12px}
.tcard .tb{flex:1;min-width:0;padding-top:8px}
.tcard .ttl{display:block;width:100%;text-align:left;background:none;border:0;padding:0;margin:0 0 8px;font:inherit;font-weight:600;font-size:15px;line-height:1.35;color:var(--app-ink);cursor:pointer}
.tcard.done .ttl{text-decoration:line-through;color:var(--app-muted)}
.tcard .tnote{font-size:13px;color:var(--app-muted);margin:-4px 0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.tcard .who{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.tcard .who.nobody{color:var(--app-muted);font-weight:500;font-style:italic}
.tcard .due{color:var(--app-muted)}.tcard .due.late{color:var(--app-danger);font-weight:600}.tcard .due.today{color:var(--app-ink);font-weight:600}
.tcard .st{margin-left:auto;cursor:pointer;border:0}
.av{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.av-0{background:#d3e2f7;color:#184a90}.av-1{background:#d4eedf;color:#1c6e42}.av-2{background:#fbe3c8;color:#7a4411}.av-3{background:#e3dcfb;color:#4b3699}.av-4{background:#cdeeea;color:#0f5e57}.av-5{background:#f8d9e2;color:#8a2347}
.bp6-dark .av-0{background:#1f3f69;color:#d6e6ff}.bp6-dark .av-1{background:#1d4a33;color:#d4f5e2}.bp6-dark .av-2{background:#5a3712;color:#ffe6c7}.bp6-dark .av-3{background:#3b2f6e;color:#e7e0ff}.bp6-dark .av-4{background:#164a45;color:#d0f5f0}.bp6-dark .av-5{background:#5e2337;color:#ffdbe6}
.bempty{color:var(--app-muted);font-size:13px;padding:8px 4px 14px}
.bdone{margin-top:24px;max-width:760px}
.bdone summary{cursor:pointer;font-size:15px;font-weight:700;color:var(--app-success);margin:0 2px 10px}
#taskDlg .bp6-dialog{width:520px;max-height:calc(100vh - 32px);overflow:auto}
#taskDlg .bp6-dialog-footer-actions{align-items:center}
#taskDlg .td-spacer{flex:1}
#taskDlg .bp6-form-group{margin-bottom:16px}
#taskDlg input,#taskDlg textarea{font-size:16px;font-family:inherit}
#taskDlg [hidden]{display:none !important}
#tdDate{margin-top:8px;width:200px}
.td-due{margin-top:6px}
@media (max-width:900px){.board-cols{grid-template-columns:1fr}.board-cols.one{grid-template-columns:1fr}.board-stats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.board{padding:12px 12px 110px}.chips .bp6-button{min-height:42px}.board-hd h2{font-size:22px}
  .board-stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.board-stats .stat{padding:8px 10px;min-width:0}.board-stats .num{font-size:22px}.board-stats .lab{font-size:11px;line-height:1.25}
  .board-filters .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -12px;padding:0 12px 2px;scrollbar-width:none}.board-filters .chips::-webkit-scrollbar{display:none}.board-filters .chips .bp6-button{flex:none}
  .bottombar .bp6-button{padding:0 6px;white-space:nowrap}#taskDlg.ovl{align-items:flex-end;padding:0}#taskDlg .bp6-dialog{width:100%;max-height:92vh;border-radius:12px 12px 0 0}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<!--ICONS-->
</defs></svg>

<nav class="bp6-navbar">
  <div class="bp6-navbar-group bp6-align-left">
    <div class="bp6-navbar-heading brand"><span class="dot"></span><span>Front Desk</span><span class="store nav-store" id="storeName"></span></div>
  </div>
  <div class="bp6-navbar-group bp6-align-right" id="navRight" style="display:none">
    <button class="bp6-button bp6-minimal nav-center" data-nav="today"><svg class="ic"><use href="#i-flag"/></svg>&nbsp;Today</button>
    <button class="bp6-button bp6-minimal nav-center" data-nav="leads"><svg class="ic"><use href="#i-search"/></svg>&nbsp;Leads</button>
    <button class="bp6-button bp6-minimal nav-center" data-nav="board"><svg class="ic"><use href="#i-board"/></svg>&nbsp;Board</button>
    <button class="bp6-button bp6-minimal nav-center" data-nav="owners"><svg class="ic"><use href="#i-dashboard"/></svg>&nbsp;Owners</button>
    <button class="bp6-button bp6-intent-success nav-center" data-walkin><svg class="ic"><use href="#i-walk"/></svg>&nbsp;Walk-in</button>
    <span class="bp6-navbar-divider"></span>
    <button class="bp6-button bp6-minimal" id="darkBtn" title="Dark mode"><svg class="ic"><use href="#i-moon"/></svg></button>
    <button class="bp6-button bp6-minimal" data-nav="settings" title="Settings"><svg class="ic"><use href="#i-cog"/></svg></button>
    <button class="bp6-button bp6-minimal" id="userBtn"><svg class="ic"><use href="#i-user"/></svg>&nbsp;<span class="nav-store" id="userName"></span></button>
  </div>
</nav>

<!-- LOGIN -->
<main class="view" id="view-login">
  <form class="bp6-card bp6-elevation-1 login" id="loginForm" novalidate>
    <h1>Front Desk</h1>
    <p>Sign in with your work email and password.</p>
    <div class="bp6-form-group"><label class="bp6-label" for="loginEmail">Email</label><div class="bp6-input-group bp6-large"><input class="bp6-input" id="loginEmail" type="email" inputmode="email" placeholder="you@floorandmorecanada.com" autocomplete="username"></div></div>
    <div class="bp6-form-group"><label class="bp6-label" for="loginPass">Password</label><div class="bp6-input-group bp6-large"><input class="bp6-input" id="loginPass" type="password" autocomplete="current-password"></div></div>
    <button type="submit" class="bp6-button bp6-intent-primary bp6-large go" id="loginBtn" style="width:100%">Sign in</button>
    <div id="loginMsg" class="login-msg" role="status"></div>
    <button type="button" class="bp6-button bp6-minimal" id="forgotBtn">Forgot password?</button>
  </form>
</main>

<!-- TODAY -->
<main class="view focus-view hidden" id="view-today">
  <div class="dayline"><span id="clock"></span><span class="bp6-text-muted" id="progressText"></span></div>
  <div class="bp6-progress-bar bp6-intent-primary bp6-no-stripes bp6-no-animation dayprog"><div class="bp6-progress-meter" id="progressBar" style="width:0%"></div></div>
  <section class="stage" id="stage"><div class="bp6-card card"><p class="say bp6-text-muted">Loading…</p></div></section>
  <div class="upnext" id="upnext"></div>
</main>

<!-- LEADS -->
<main class="view hidden" id="view-leads">
  <div class="leadlist">
    <div class="bp6-input-group bp6-large" style="margin-bottom:12px"><input class="bp6-input" id="leadSearch" placeholder="Search a name or phone"></div>
    <div id="leadRows"></div>
  </div>
</main>

<!-- BOARD (team tasks: sales / ops / marketing) -->
<main class="view hidden" id="view-board">
  <div class="board">
    <div class="board-hd">
      <div>
        <h2 class="bp6-heading">Team board</h2>
        <div class="bp6-text-muted" id="boardSub"></div>
      </div>
      <button class="bp6-button bp6-intent-primary bp6-large" id="boardAdd"><svg class="ic"><use href="#i-plus"/></svg>&nbsp;Add task</button>
    </div>
    <div class="board-stats" id="boardStats"></div>
    <div class="board-filters">
      <div class="chips" id="boardWho" role="group" aria-label="Whose tasks"></div>
      <div class="chips" id="boardArea" role="group" aria-label="Part of the business"></div>
    </div>
    <div class="board-cols" id="boardCols"><p class="bp6-text-muted">Loading…</p></div>
    <div id="boardDone"></div>
  </div>
</main>

<!-- OWNERS -->
<main class="view hidden" id="view-owners"><div class="owners" id="ownersBody"><p class="bp6-text-muted">Loading…</p></div></main>

<!-- SETTINGS -->
<main class="view hidden" id="view-settings"><div class="settings" id="settingsBody"></div></main>

<!-- LEAD PANEL -->
<div class="panel-back" id="panelBack"></div>
<aside class="panel" id="panel" aria-hidden="true">
  <div class="hd"><div><h3 id="pName">—</h3><div class="sub" id="pSub"></div></div><button class="bp6-button bp6-minimal" id="panelClose"><svg class="ic"><use href="#i-cross"/></svg></button></div>
  <div class="bd">
    <div class="nextstep" id="pNextWrap"><div><div class="bp6-text-muted bp6-text-small">Next step</div><b id="pNext">—</b></div></div>
    <div class="qgrid" id="pQ"></div>
    <div class="notebox" id="noteBox">
      <textarea class="bp6-input bp6-fill" id="nText" rows="2" placeholder="Leave a note — goes on the lead here and into GHL"></textarea>
      <div class="promise">
        <span class="bp6-text-muted bp6-text-small">I promised to…</span>
        <div class="chips" id="nPromise">
          <button class="bp6-button bp6-small bp6-outlined" data-p="">nothing</button>
          <button class="bp6-button bp6-small bp6-outlined" data-p="Send the PDF / render">send the PDF</button>
          <button class="bp6-button bp6-small bp6-outlined" data-p="Call back">call back</button>
          <button class="bp6-button bp6-small bp6-outlined" data-p="Send the quote">send the quote</button>
          <button class="bp6-button bp6-small bp6-outlined" data-p="Book the visit">book the visit</button>
          <button class="bp6-button bp6-small bp6-outlined" data-p="Send the address + times">send address</button>
        </div>
        <div class="when" id="nWhen" hidden>
          <span class="bp6-text-muted bp6-text-small">by</span>
          <div class="bp6-html-select bp6-small"><select id="nDue"><option value="60">in 1 hour</option><option value="eod">end of today</option><option value="tom9">tomorrow 9:00</option><option value="tom15">tomorrow 15:00</option><option value="pick">pick a time…</option></select></div>
          <input class="bp6-input bp6-small" type="datetime-local" id="nDueAt" hidden>
        </div>
      </div>
      <div class="row2"><span class="bp6-text-small bp6-text-muted" id="nHint"></span><button class="bp6-button bp6-intent-primary" id="nSave">Save note</button></div>
    </div>
    <h5 class="bp6-heading" style="margin:0 0 10px">What happened</h5>
    <div class="thread" id="pThread"></div>
  </div>
</aside>

<!-- WALK-IN -->
<div class="ovl" id="walkin">
  <div class="bp6-dialog">
    <div class="bp6-dialog-header"><h6 class="bp6-heading">Walk-in · 20 seconds</h6><button class="bp6-dialog-close-button bp6-button bp6-minimal" data-walkin-close><svg class="ic"><use href="#i-cross"/></svg></button></div>
    <div class="bp6-dialog-body">
      <div class="bp6-form-group"><label class="bp6-label">Name</label><div class="bp6-input-group bp6-large"><input class="bp6-input" id="wName" placeholder="First and last" autocomplete="off"></div></div>
      <div class="bp6-form-group"><label class="bp6-label">Phone</label><div class="bp6-input-group bp6-large"><input class="bp6-input" id="wPhone" inputmode="tel" placeholder="780-"></div></div>
      <div class="bp6-form-group"><label class="bp6-label">Here for</label><div class="bp6-html-select bp6-large bp6-fill"><select id="wService"><option>Vinyl plank</option><option>Laminate</option><option>Hardwood</option><option>Tile</option><option>Carpet</option><option>Full reno</option></select></div></div>
      <label class="bp6-control bp6-checkbox bp6-large"><input type="checkbox" class="bp6-control-input" id="wConsent" checked><span class="bp6-control-indicator"></span>OK to text / email about this project</label>
    </div>
    <div class="bp6-dialog-footer"><div class="bp6-dialog-footer-actions"><button class="bp6-button" data-walkin-close>Cancel</button><button class="bp6-button bp6-intent-success bp6-large" id="walkinSave">Save · follow-up tomorrow 10:00</button></div></div>
  </div>
</div>

<!-- TEAM TASK -->
<div class="ovl" id="taskDlg">
  <div class="bp6-dialog" role="dialog" aria-modal="true" aria-labelledby="tdTitle">
    <div class="bp6-dialog-header"><h6 class="bp6-heading" id="tdTitle">New task</h6><button class="bp6-dialog-close-button bp6-button bp6-minimal" data-td-close aria-label="Close"><svg class="ic"><use href="#i-cross"/></svg></button></div>
    <div class="bp6-dialog-body">
      <div class="bp6-form-group"><label class="bp6-label" for="tdText">What needs doing?</label><div class="bp6-input-group bp6-large"><input class="bp6-input" id="tdText" placeholder="e.g. Order grout for next week’s tile job" autocomplete="off"></div></div>
      <div class="bp6-form-group"><span class="bp6-label">Part of the business</span><div class="chips seg" id="tdArea"></div></div>
      <div class="bp6-form-group"><span class="bp6-label">Who owns it?</span><div class="chips" id="tdOwner"></div></div>
      <div class="bp6-form-group"><span class="bp6-label">Due</span><div class="chips" id="tdDue"></div><input class="bp6-input" type="date" id="tdDate" hidden><div class="bp6-text-muted bp6-text-small td-due" id="tdDueText"></div></div>
      <div class="bp6-form-group" id="tdStatusWrap" hidden><span class="bp6-label">Status</span><div class="chips seg" id="tdStatus"></div></div>
      <div class="bp6-form-group"><label class="bp6-label" for="tdNote">Note <span class="bp6-text-muted">(optional)</span></label><textarea class="bp6-input bp6-fill" id="tdNote" rows="2" placeholder="Anything they need to know"></textarea></div>
    </div>
    <div class="bp6-dialog-footer"><div class="bp6-dialog-footer-actions"><button class="bp6-button bp6-minimal bp6-intent-danger" id="tdDelete" hidden>Delete</button><span class="td-spacer"></span><button class="bp6-button" data-td-close>Cancel</button><button class="bp6-button bp6-intent-primary bp6-large" id="tdSave">Add task</button></div></div>
  </div>
</div>

<div class="bottombar" id="bottombar" style="display:none">
  <button class="bp6-button bp6-intent-success bp6-large" data-walkin><svg class="ic"><use href="#i-walk"/></svg>&nbsp;Walk-in</button>
  <button class="bp6-button bp6-outlined bp6-large" data-nav="leads">Leads</button>
  <button class="bp6-button bp6-outlined bp6-large" data-nav="board">Board</button>
  <button class="bp6-button bp6-outlined bp6-large" data-nav="owners">Owners</button>
</div>

<div class="bp6-toast bp6-intent-success toast" id="toast"><span class="bp6-toast-message" id="toastMsg">Saved</span></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>/*APP_JS*/</script>
</body>
</html>
